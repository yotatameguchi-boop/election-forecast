# 未実施レースの予測を定期的に凍結する。
#
# このプロジェクトで最初に見つかった問題は「予測欄に結果が入っていた」ことで、
# 過去7レースは予測時の記録が無いために永久に採点できない。原因は
# 「誰かが投開票前に snapshot を取る」という人手の手順に頼っていたこと。
#
# snapshot.js は既存を上書きしないので、定期実行しても最初の一度しか書かない。
# つまり「レースを追加したら、次の実行で自動的に凍結され、以後は不変」になる。
# 取り忘れという失敗モードが構造的に消える。
name: freeze-forecast

on:
  schedule:
    - cron: '17 3 * * 1'      # 毎週月曜 03:17 UTC（12:17 JST）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: freeze-forecast
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 予測を凍結する
        run: |
          set -euo pipefail
          node build.js
          node snapshot.js

      - name: 新しい凍結があればコミットする
        run: |
          set -euo pipefail
          git config user.name  'politisaber-bot'
          git config user.email 'actions@github.com'
          git add forecasts/
          if git diff --cached --quiet; then
            echo "新しい凍結はありません（既存はそのまま）。"
            exit 0
          fi
          # 何が増えたかをメッセージに残す
          NEW=$(git diff --cached --name-only --diff-filter=A | xargs -n1 basename 2>/dev/null | tr '\n' ' ')
          git commit -m "予測を凍結: ${NEW}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push 競合。再試行 $i"
            sleep $((i * 5))
          done
          exit 1

      - name: 凍結済みの一覧を表示する
        run: node snapshot.js --list
